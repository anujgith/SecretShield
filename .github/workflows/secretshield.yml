name: SecretShield CI Security Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretshield-scan:
    name: SecretShield security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install required scanner dependency (Gitleaks)
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${checksum}" "${RUNNER_TEMP}/${archive}" | sha256sum --check --status
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          echo "GITLEAKS_PATH=${RUNNER_TEMP}/gitleaks" >> "${GITHUB_ENV}"

      - name: Run SecretShield security scan
        run: python scripts/secretshield_ci.py
